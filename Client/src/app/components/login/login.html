<form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
    <mat-form-field>
        <mat-label>Email</mat-label>
        <input matInput formControlName="email">
        @if(loginForm.get('email')?.touched && loginForm.get('email')?.invalid) {
        <p>Email invalid.</p>
    }
    </mat-form-field>

    <mat-form-field>
        <mat-label>Parola</mat-label>
        <input matInput formControlName="parola">
        @if(loginForm.get('parola')?.touched && loginForm.get('parola')?.invalid) {
        <p>Parola invalida.</p>
    }
    </mat-form-field>


    <button type="submit" [disabled]="loginForm.invalid" mat-raised-button>Log In</button>

    @if(eroare) {
        <p>{{ eroare }}.</p>
    }    
</form>
